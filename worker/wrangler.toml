# Cloudflare side of GridPulse, declared as configuration (Workers Free plan).
name = "gridpulse"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Custom domain (zone fde.lt is on the same Cloudflare account).
# Cloudflare creates the DNS record and TLS certificate on deploy.
routes = [
  { pattern = "status.fde.lt", custom_domain = true }
]

# Status page is served by the same Worker as static assets.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/metrics"]

# Probe every minute, evaluate SLOs every 5 minutes.
[triggers]
crons = ["* * * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "gridpulse"
# Created by `npx wrangler d1 create gridpulse`; paste the id it prints.
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Output `api_url` of infra/gcp/service.
API_URL = "https://REPLACE_WITH_CLOUD_RUN_URL"
GITHUB_REPO = "VR-SAGA/gridpulse"
# Set to "false" to stop opening GitHub issues (alerts still show on the page).
INCIDENTS_ENABLED = "true"

# Secrets (never committed):
#   npx wrangler secret put GITHUB_TOKEN   # fine-grained PAT, Issues: read & write on this repo only

[observability]
enabled = true
