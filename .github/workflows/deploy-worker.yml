name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - config/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    # Skips until the Cloudflare account is configured.
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Ensure D1 database exists
        # Idempotent: creates the database on the first run, then reuses it.
        # The ID is injected at deploy time, so wrangler.toml stays account-neutral.
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "gridpulse") | .uuid'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create gridpulse --location weur
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "could not resolve D1 database id"; exit 1; }
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${id}/" wrangler.toml
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply gridpulse --remote
      - name: Deploy Worker
        run: |
          api_url="${{ vars.API_URL }}"
          if [ -n "$api_url" ]; then
            npx wrangler deploy --var "API_URL:${api_url}"
          else
            echo "::warning::API_URL variable not set; the api probe will fail until it is."
            npx wrangler deploy
          fi
      - name: Sync incident token
        # Optional: lets the Worker open GitHub issues. Fine-grained PAT,
        # Issues read/write on this repository only.
        env:
          INCIDENT_TOKEN: ${{ secrets.INCIDENT_GITHUB_TOKEN }}
        run: |
          if [ -n "$INCIDENT_TOKEN" ]; then
            printf '%s' "$INCIDENT_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          else
            echo "::notice::INCIDENT_GITHUB_TOKEN not set; incidents show on the status page only."
          fi
      - name: Summary
        run: |
          echo "### Worker deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status page: https://status.fde.lt" >> "$GITHUB_STEP_SUMMARY"
